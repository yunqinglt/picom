# Nord/dwm profile for picom 13. GPU compositing on the display-driving GPU.
log-level = "info";
backend = "glx";
vsync = true;
use-damage = true;
no-frame-pacing = false;
unredir-if-possible = false;
use-ewmh-active-win = true;
detect-client-opacity = true;

shadow = true;
shadow-radius = 10;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.2;
corner-radius = 6;
frame-opacity = 1.0;
fading = false;
blur-method = "none";

# Animate lifetime events for both tiled and floating clients. No position/size
# animations: dragging and interactive resizing must follow the pointer directly.
# ConfigureNotify during startup is handled by the win.c fix in this branch.
animations = (
  {
    triggers = ["open", "show"];
    preset = "appear";
    duration = 0.14;
    scale = 0.96;
  },
  {
    # Include hide: X11 applications may unmap before destroying their window.
    triggers = ["close", "hide"];
    preset = "disappear";
    duration = 0.12;
    scale = 0.98;
  }
);

rules = (
  {
    # Keep video presentation synchronized even when an app requests bypass.
    unredir = false;
  },
  {
    match = "fullscreen";
    corner-radius = 0;
    shadow = false;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop' || "
            "window_type = 'tooltip' || window_type = 'popup_menu' || "
            "window_type = 'dropdown_menu' || class_g = 'dwm' || "
            "class_g = 'Rofi' || class_g = 'Dunst' || class_g = 'slop' || "
            "class_g = 'i3lock'";
    shadow = false;
    corner-radius = 0;
    animations = ({
      triggers = ["open", "close", "show", "hide"];
      opacity = 1.0;
    });
  }
);
